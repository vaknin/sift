[package]
name = "sift-app"
version = "0.1.0"
edition = "2024"

[lib]
name = "sift_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
sift-engine = { version = "0.1.0", path = "../crates/engine" }
tauri = { version = "2.12.0", features = ["protocol-asset"] }
# Same version tauri links; used for a folder chooser that is a child of the window.
gtk = "0.18.2"
